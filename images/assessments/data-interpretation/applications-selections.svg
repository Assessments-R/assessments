<svg xmlns="http://www.w3.org/2000/svg" width="850" height="500" viewBox="0 0 850 500" role="img">
  <title>Applications and Selections</title>

  <rect width="850" height="500" fill="#ffffff"/>

  <text x="425" y="35" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2937">
    Applications and Selections
  </text>

  <text x="425" y="60" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="14" fill="#6b7280">
    Recruitment data from 2022 to 2025
  </text>

  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="90" y1="390" x2="780" y2="390"/>
    <line x1="90" y1="340" x2="780" y2="340"/>
    <line x1="90" y1="290" x2="780" y2="290"/>
    <line x1="90" y1="240" x2="780" y2="240"/>
    <line x1="90" y1="190" x2="780" y2="190"/>
    <line x1="90" y1="140" x2="780" y2="140"/>
    <line x1="90" y1="90" x2="780" y2="90"/>
  </g>

  <g stroke="#374151" stroke-width="2">
    <line x1="90" y1="90" x2="90" y2="390"/>
    <line x1="90" y1="390" x2="780" y2="390"/>
  </g>

  <g font-family="Arial, sans-serif" font-size="13" fill="#4b5563" text-anchor="end">
    <text x="78" y="395">0</text>
    <text x="78" y="345">100</text>
    <text x="78" y="295">200</text>
    <text x="78" y="245">300</text>
    <text x="78" y="195">400</text>
    <text x="78" y="145">500</text>
    <text x="78" y="95">600</text>
  </g>

  <!-- 2022 -->
  <rect x="135" y="240" width="55" height="150" rx="4" fill="#2563eb"/>
  <rect x="195" y="330" width="55" height="60" rx="4" fill="#16a34a"/>

  <!-- 2023 -->
  <rect x="300" y="190" width="55" height="200" rx="4" fill="#2563eb"/>
  <rect x="360" y="300" width="55" height="90" rx="4" fill="#16a34a"/>

  <!-- 2024 -->
  <rect x="465" y="140" width="55" height="250" rx="4" fill="#2563eb"/>
  <rect x="525" y="277.5" width="55" height="112.5" rx="4" fill="#16a34a"/>

  <!-- 2025 -->
  <rect x="630" y="90" width="55" height="300" rx="4" fill="#2563eb"/>
  <rect x="690" y="240" width="55" height="150" rx="4" fill="#16a34a"/>

  <g font-family="Arial, sans-serif" font-size="12" font-weight="700"
     fill="#1f2937" text-anchor="middle">
    <text x="162.5" y="230">300</text>
    <text x="222.5" y="320">120</text>

    <text x="327.5" y="180">400</text>
    <text x="387.5" y="290">180</text>

    <text x="492.5" y="130">500</text>
    <text x="552.5" y="267">225</text>

    <text x="657.5" y="80">600</text>
    <text x="717.5" y="230">300</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="14" fill="#374151" text-anchor="middle">
    <text x="192" y="418">2022</text>
    <text x="357" y="418">2023</text>
    <text x="522" y="418">2024</text>
    <text x="687" y="418">2025</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="14" fill="#374151">
    <rect x="280" y="452" width="18" height="18" rx="3" fill="#2563eb"/>
    <text x="307" y="466">Applications</text>

    <rect x="440" y="452" width="18" height="18" rx="3" fill="#16a34a"/>
    <text x="467" y="466">Selections</text>
  </g>
</svg>
