<svg xmlns="http://www.w3.org/2000/svg" width="850" height="500" viewBox="0 0 850 500" role="img">
  <title>Male and Female Employees by Department</title>

  <rect width="850" height="500" fill="#ffffff"/>

  <text x="425" y="35" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2937">
    Employees by Department
  </text>

  <text x="425" y="60" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="14" fill="#6b7280">
    Male and female employees
  </text>

  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="90" y1="390" x2="780" y2="390"/>
    <line x1="90" y1="315" x2="780" y2="315"/>
    <line x1="90" y1="240" x2="780" y2="240"/>
    <line x1="90" y1="165" x2="780" y2="165"/>
    <line x1="90" y1="90" x2="780" y2="90"/>
  </g>

  <g stroke="#374151" stroke-width="2">
    <line x1="90" y1="90" x2="90" y2="390"/>
    <line x1="90" y1="390" x2="780" y2="390"/>
  </g>

  <g font-family="Arial, sans-serif" font-size="13" fill="#4b5563" text-anchor="end">
    <text x="78" y="395">0</text>
    <text x="78" y="320">50</text>
    <text x="78" y="245">100</text>
    <text x="78" y="170">150</text>
    <text x="78" y="95">200</text>
  </g>

  <!-- Technical: men 120, women 80 -->
  <rect x="135" y="210" width="95" height="180" fill="#2563eb"/>
  <rect x="135" y="90" width="95" height="120" fill="#db2777"/>

  <!-- Sales: men 80, women 60 -->
  <rect x="300" y="270" width="95" height="120" fill="#2563eb"/>
  <rect x="300" y="180" width="95" height="90" fill="#db2777"/>

  <!-- HR: men 40, women 60 -->
  <rect x="465" y="330" width="95" height="60" fill="#2563eb"/>
  <rect x="465" y="240" width="95" height="90" fill="#db2777"/>

  <!-- Finance: men 55, women 45 -->
  <rect x="630" y="307.5" width="95" height="82.5" fill="#2563eb"/>
  <rect x="630" y="240" width="95" height="67.5" fill="#db2777"/>

  <g font-family="Arial, sans-serif" font-size="13" font-weight="700"
     fill="#ffffff" text-anchor="middle">
    <text x="182.5" y="305">120</text>
    <text x="182.5" y="155">80</text>

    <text x="347.5" y="335">80</text>
    <text x="347.5" y="230">60</text>

    <text x="512.5" y="368">40</text>
    <text x="512.5" y="290">60</text>

    <text x="677.5" y="355">55</text>
    <text x="677.5" y="278">45</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="14" fill="#374151" text-anchor="middle">
    <text x="182.5" y="418">Technical</text>
    <text x="347.5" y="418">Sales</text>
    <text x="512.5" y="418">HR</text>
    <text x="677.5" y="418">Finance</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="14" fill="#374151">
    <rect x="310" y="452" width="18" height="18" rx="3" fill="#2563eb"/>
    <text x="338" y="466">Men</text>

    <rect x="430" y="452" width="18" height="18" rx="3" fill="#db2777"/>
    <text x="458" y="466">Women</text>
  </g>
</svg>
