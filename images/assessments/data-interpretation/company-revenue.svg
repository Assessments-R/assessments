<svg
  xmlns="http://www.w3.org/2000/svg"
  width="800"
  height="450"
  viewBox="0 0 800 450"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Company Revenue from 2021 to 2025</title>
  <desc id="description">
    Line graph showing revenue values of 200, 240, 300, 270 and 360 from 2021 to 2025.
  </desc>

  <rect width="800" height="450" fill="#ffffff" />

  <text
    x="400"
    y="35"
    text-anchor="middle"
    font-family="Arial, sans-serif"
    font-size="24"
    font-weight="700"
    fill="#1f2937"
  >
    Company Revenue
  </text>

  <text
    x="400"
    y="60"
    text-anchor="middle"
    font-family="Arial, sans-serif"
    font-size="14"
    fill="#6b7280"
  >
    Revenue from 2021 to 2025
  </text>

  <!-- Horizontal grid lines -->
  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="90" y1="360" x2="740" y2="360" />
    <line x1="90" y1="290" x2="740" y2="290" />
    <line x1="90" y1="220" x2="740" y2="220" />
    <line x1="90" y1="150" x2="740" y2="150" />
    <line x1="90" y1="80" x2="740" y2="80" />
  </g>

  <!-- Axes -->
  <g stroke="#374151" stroke-width="2">
    <line x1="90" y1="80" x2="90" y2="360" />
    <line x1="90" y1="360" x2="740" y2="360" />
  </g>

  <!-- Y-axis labels -->
  <g
    font-family="Arial, sans-serif"
    font-size="14"
    fill="#4b5563"
    text-anchor="end"
  >
    <text x="78" y="365">0</text>
    <text x="78" y="295">100</text>
    <text x="78" y="225">200</text>
    <text x="78" y="155">300</text>
    <text x="78" y="85">400</text>
  </g>

  <!-- X-axis labels -->
  <g
    font-family="Arial, sans-serif"
    font-size="14"
    fill="#4b5563"
    text-anchor="middle"
  >
    <text x="130" y="390">2021</text>
    <text x="275" y="390">2022</text>
    <text x="420" y="390">2023</text>
    <text x="565" y="390">2024</text>
    <text x="710" y="390">2025</text>
  </g>

  <!-- Axis titles -->
  <text
    x="415"
    y="425"
    text-anchor="middle"
    font-family="Arial, sans-serif"
    font-size="15"
    font-weight="600"
    fill="#374151"
  >
    Year
  </text>

  <text
    x="25"
    y="220"
    text-anchor="middle"
    transform="rotate(-90 25 220)"
    font-family="Arial, sans-serif"
    font-size="15"
    font-weight="600"
    fill="#374151"
  >
    Revenue
  </text>

  <!-- Revenue line -->
  <polyline
    points="130,220 275,192 420,150 565,171 710,108"
    fill="none"
    stroke="#2563eb"
    stroke-width="4"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Data points -->
  <g fill="#2563eb" stroke="#ffffff" stroke-width="3">
    <circle cx="130" cy="220" r="7" />
    <circle cx="275" cy="192" r="7" />
    <circle cx="420" cy="150" r="7" />
    <circle cx="565" cy="171" r="7" />
    <circle cx="710" cy="108" r="7" />
  </g>

  <!-- Value labels -->
  <g
    font-family="Arial, sans-serif"
    font-size="14"
    font-weight="700"
    fill="#1f2937"
    text-anchor="middle"
  >
    <text x="130" y="205">200</text>
    <text x="275" y="177">240</text>
    <text x="420" y="135">300</text>
    <text x="565" y="156">270</text>
    <text x="710" y="93">360</text>
  </g>
</svg>
