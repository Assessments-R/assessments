<svg xmlns="http://www.w3.org/2000/svg" width="850" height="480" viewBox="0 0 850 480" role="img">
  <title>Monthly Production from January to June</title>

  <rect width="850" height="480" fill="#ffffff"/>

  <text x="425" y="35" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2937">
    Monthly Production
  </text>

  <text x="425" y="60" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="14" fill="#6b7280">
    Production from January to June
  </text>

  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="90" y1="370" x2="780" y2="370"/>
    <line x1="90" y1="310" x2="780" y2="310"/>
    <line x1="90" y1="250" x2="780" y2="250"/>
    <line x1="90" y1="190" x2="780" y2="190"/>
    <line x1="90" y1="130" x2="780" y2="130"/>
    <line x1="90" y1="70" x2="780" y2="70"/>
  </g>

  <g stroke="#374151" stroke-width="2">
    <line x1="90" y1="70" x2="90" y2="370"/>
    <line x1="90" y1="370" x2="780" y2="370"/>
  </g>

  <g font-family="Arial, sans-serif" font-size="13" fill="#4b5563" text-anchor="end">
    <text x="78" y="375">0</text>
    <text x="78" y="315">100</text>
    <text x="78" y="255">200</text>
    <text x="78" y="195">300</text>
    <text x="78" y="135">400</text>
    <text x="78" y="75">500</text>
  </g>

  <polyline
    points="130,130 250,100 370,70 490,82 610,58 730,88"
    fill="none"
    stroke="#16a34a"
    stroke-width="4"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <g fill="#16a34a" stroke="#ffffff" stroke-width="3">
    <circle cx="130" cy="130" r="7"/>
    <circle cx="250" cy="100" r="7"/>
    <circle cx="370" cy="70" r="7"/>
    <circle cx="490" cy="82" r="7"/>
    <circle cx="610" cy="58" r="7"/>
    <circle cx="730" cy="88" r="7"/>
  </g>

  <g font-family="Arial, sans-serif" font-size="13" font-weight="700"
     fill="#1f2937" text-anchor="middle">
    <text x="130" y="115">400</text>
    <text x="250" y="85">450</text>
    <text x="370" y="55">500</text>
    <text x="490" y="67">480</text>
    <text x="610" y="43">520</text>
    <text x="730" y="73">470</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="13" fill="#374151" text-anchor="middle">
    <text x="130" y="400">January</text>
    <text x="250" y="400">February</text>
    <text x="370" y="400">March</text>
    <text x="490" y="400">April</text>
    <text x="610" y="400">May</text>
    <text x="730" y="400">June</text>
  </g>

  <text x="435" y="445" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#374151">
    Month
  </text>

  <text x="25" y="225" text-anchor="middle"
        transform="rotate(-90 25 225)"
        font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#374151">
    Production units
  </text>
</svg>
