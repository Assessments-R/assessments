<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img">
  <title>Company Expenditure Distribution</title>

  <rect width="800" height="500" fill="#ffffff"/>

  <text x="400" y="35" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2937">
    Company Expenditure
  </text>

  <text x="400" y="60" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="14" fill="#6b7280">
    Percentage distribution of total expenditure
  </text>

  <!-- Pie chart centred at 300,270 with radius 150 -->

  <!-- Salaries 35% -->
  <path d="M300 270 L300 120
           A150 150 0 0 1 421.35 358.17 Z"
        fill="#2563eb" stroke="#ffffff" stroke-width="2"/>

  <!-- Rent 20% -->
  <path d="M300 270 L421.35 358.17
           A150 150 0 0 1 211.83 391.35 Z"
        fill="#16a34a" stroke="#ffffff" stroke-width="2"/>

  <!-- Marketing 15% -->
  <path d="M300 270 L211.83 391.35
           A150 150 0 0 1 150 270 Z"
        fill="#f59e0b" stroke="#ffffff" stroke-width="2"/>

  <!-- Technology 20% -->
  <path d="M300 270 L150 270
           A150 150 0 0 1 253.65 127.34 Z"
        fill="#dc2626" stroke="#ffffff" stroke-width="2"/>

  <!-- Other 10% -->
  <path d="M300 270 L253.65 127.34
           A150 150 0 0 1 300 120 Z"
        fill="#7c3aed" stroke="#ffffff" stroke-width="2"/>

  <g font-family="Arial, sans-serif" font-size="14" font-weight="700"
     fill="#ffffff" text-anchor="middle">
    <text x="365" y="220">35%</text>
    <text x="325" y="355">20%</text>
    <text x="200" y="335">15%</text>
    <text x="190" y="215">20%</text>
    <text x="275" y="165">10%</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="15" fill="#374151">
    <rect x="520" y="155" width="18" height="18" rx="3" fill="#2563eb"/>
    <text x="550" y="169">Salaries — 35%</text>

    <rect x="520" y="200" width="18" height="18" rx="3" fill="#16a34a"/>
    <text x="550" y="214">Rent — 20%</text>

    <rect x="520" y="245" width="18" height="18" rx="3" fill="#f59e0b"/>
    <text x="550" y="259">Marketing — 15%</text>

    <rect x="520" y="290" width="18" height="18" rx="3" fill="#dc2626"/>
    <text x="550" y="304">Technology — 20%</text>

    <rect x="520" y="335" width="18" height="18" rx="3" fill="#7c3aed"/>
    <text x="550" y="349">Other — 10%</text>
  </g>
</svg>
