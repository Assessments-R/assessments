<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" role="img">
  <title>Students Placed by Branch</title>

  <rect width="800" height="480" fill="#ffffff"/>

  <text x="400" y="35" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2937">
    Students Placed by Branch
  </text>

  <text x="400" y="60" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="14" fill="#6b7280">
    Number of students placed
  </text>

  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="90" y1="380" x2="750" y2="380"/>
    <line x1="90" y1="310" x2="750" y2="310"/>
    <line x1="90" y1="240" x2="750" y2="240"/>
    <line x1="90" y1="170" x2="750" y2="170"/>
    <line x1="90" y1="100" x2="750" y2="100"/>
  </g>

  <g stroke="#374151" stroke-width="2">
    <line x1="90" y1="90" x2="90" y2="380"/>
    <line x1="90" y1="380" x2="750" y2="380"/>
  </g>

  <g font-family="Arial, sans-serif" font-size="13" fill="#4b5563" text-anchor="end">
    <text x="78" y="385">0</text>
    <text x="78" y="315">50</text>
    <text x="78" y="245">100</text>
    <text x="78" y="175">150</text>
    <text x="78" y="105">200</text>
  </g>

  <g fill="#2563eb">
    <rect x="125" y="128" width="80" height="252" rx="5"/>
    <rect x="250" y="184" width="80" height="196" rx="5"/>
    <rect x="375" y="240" width="80" height="140" rx="5"/>
    <rect x="500" y="268" width="80" height="112" rx="5"/>
    <rect x="625" y="268" width="80" height="112" rx="5"/>
  </g>

  <g font-family="Arial, sans-serif" font-size="14" font-weight="700"
     fill="#1f2937" text-anchor="middle">
    <text x="165" y="118">180</text>
    <text x="290" y="174">140</text>
    <text x="415" y="230">100</text>
    <text x="540" y="258">80</text>
    <text x="665" y="258">80</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="13" fill="#374151" text-anchor="middle">
    <text x="165" y="405">CSE</text>
    <text x="290" y="405">ECE</text>
    <text x="415" y="405">EEE</text>
    <text x="540" y="405">Mechanical</text>
    <text x="665" y="405">Civil</text>
  </g>

  <text x="420" y="450" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#374151">
    Branch
  </text>

  <text x="25" y="240" text-anchor="middle"
        transform="rotate(-90 25 240)"
        font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#374151">
    Students placed
  </text>
</svg>
