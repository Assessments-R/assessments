<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Learning Topic | Assessment Portal</title>

  <style>
    :root {
      --primary: #3157d5;
      --primary-dark: #223e9f;
      --background: #f4f7fc;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #64748b;
      --border: #dfe5ef;
      --formula-bg: #eef2ff;
      --example-bg: #f0fdf4;
      --warning-bg: #fff7ed;
      --shadow: 0 8px 24px rgba(31, 41, 55, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.65;
      color: var(--text);
      background: var(--background);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .site-header {
      padding: 16px 0;
      color: white;
      background: linear-gradient(
        135deg,
        var(--primary-dark),
        var(--primary)
      );
    }

    .header-container {
      width: min(1000px, 92%);
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      font-size: 20px;
      font-weight: 700;
    }

    .back-link {
      padding: 8px 14px;
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 8px;
      font-size: 14px;
    }

    .page-container {
      width: min(1000px, 92%);
      margin: 32px auto 60px;
    }

    .topic-hero {
      padding: 34px;
      margin-bottom: 24px;
      background: white;
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: var(--shadow);
    }

    .category-label {
      display: inline-block;
      padding: 6px 12px;
      margin-bottom: 13px;
      border-radius: 999px;
      color: var(--primary-dark);
      background: #e0e7ff;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .topic-hero h1 {
      font-size: clamp(30px, 5vw, 46px);
      line-height: 1.15;
    }

    .topic-subtitle {
      margin-top: 8px;
      color: var(--primary);
      font-weight: 700;
    }

    .topic-description {
      margin-top: 14px;
      color: var(--muted);
    }

    .learning-time {
      display: inline-block;
      margin-top: 18px;
      padding: 7px 12px;
      border-radius: 8px;
      background: #f1f5f9;
      color: var(--muted);
      font-size: 14px;
    }

    .content-card {
      margin-bottom: 22px;
      padding: 28px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 4px 14px rgba(31, 41, 55, 0.05);
    }

    .content-card h2 {
      margin-bottom: 15px;
      color: var(--primary-dark);
      font-size: 23px;
    }

    .content-card h3 {
      margin: 20px 0 10px;
      font-size: 17px;
    }

    .content-card ul {
      padding-left: 22px;
    }

    .content-card li {
      margin-bottom: 7px;
    }

    .formula-list {
      display: grid;
      gap: 10px;
      margin-top: 15px;
    }

    .formula {
      padding: 13px 15px;
      border-left: 4px solid var(--primary);
      border-radius: 7px;
      background: var(--formula-bg);
      font-family: Consolas, monospace;
      font-weight: 700;
    }

    .example {
      margin-top: 14px;
      padding: 16px;
      border-left: 4px solid #15803d;
      border-radius: 8px;
      background: var(--example-bg);
    }

    .example-question {
      margin-bottom: 7px;
      font-weight: 700;
    }

    .example-solution {
      color: #166534;
    }

    .conversion-table {
      width: 100%;
      margin-top: 15px;
      border-collapse: collapse;
    }

    .conversion-table th,
    .conversion-table td {
      padding: 11px;
      text-align: left;
      border: 1px solid var(--border);
    }

    .conversion-table th {
      color: white;
      background: var(--primary);
    }

    .conversion-table tr:nth-child(even) {
      background: #f8fafc;
    }

    .shortcut-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .shortcut {
      padding: 15px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #f8fafc;
    }

    .shortcut strong {
      display: block;
      margin-bottom: 5px;
      color: var(--primary-dark);
    }

    .mistake-card {
      background: var(--warning-bg);
    }

    .assessment-area {
      padding: 38px 25px;
      text-align: center;
      background: white;
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow);
    }

    .assessment-area h2 {
      margin-bottom: 9px;
    }

    .assessment-area p {
      margin-bottom: 22px;
      color: var(--muted);
    }

    .start-button {
      display: inline-block;
      min-width: 220px;
      padding: 14px 25px;
      border-radius: 10px;
      color: white;
      background: var(--primary);
      font-size: 16px;
      font-weight: 700;
      transition:
        transform 0.2s ease,
        background 0.2s ease;
    }

    .start-button:hover {
      background: var(--primary-dark);
      transform: translateY(-2px);
    }

    .loading,
    .error-message {
      padding: 40px 20px;
      text-align: center;
      background: white;
      border-radius: 14px;
    }

    .error-message {
      color: #b91c1c;
    }

    footer {
      padding: 22px;
      text-align: center;
      color: #cbd5e1;
      background: #172033;
    }

    @media (max-width: 650px) {
      .topic-hero,
      .content-card {
        padding: 22px;
      }

      .shortcut-grid {
        grid-template-columns: 1fr;
      }

      .conversion-table {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>
  <header class="site-header">
    <div class="header-container">
      <a class="brand" href="index.html">
        Assessment Portal
      </a>

      <a class="back-link" href="index.html">
        ← Back to Topics
      </a>
    </div>
  </header>

  <main class="page-container">
    <div id="pageContent">
      <div class="loading">
        Loading learning content...
      </div>
    </div>
  </main>

  <footer>
    Assessment Learning Portal
  </footer>

  <script>
    const pageContent =
      document.getElementById("pageContent");

    const urlParameters =
      new URLSearchParams(window.location.search);

    /*
      These defaults ensure that opening topic.html directly
      loads the first topic: Percentages.
    */
    const category =
      urlParameters.get("category") || "QR";

    const topic =
      urlParameters.get("topic") || "percentages";

    const topicFile =
      `data/topics/${category}/${topic}.json`;

    function createList(items) {
      if (!Array.isArray(items) || items.length === 0) {
        return "";
      }

      return `
        <ul>
          ${items.map(item => `<li>${item}</li>`).join("")}
        </ul>
      `;
    }

    function createFormulas(formulas) {
      if (!Array.isArray(formulas) || formulas.length === 0) {
        return "";
      }

      return `
        <h3>Important Formulas</h3>

        <div class="formula-list">
          ${formulas
            .map(formula => `
              <div class="formula">${formula}</div>
            `)
            .join("")}
        </div>
      `;
    }

    function createExamples(examples) {
      if (!Array.isArray(examples) || examples.length === 0) {
        return "";
      }

      return `
        <h3>Examples</h3>

        ${examples
          .map(example => `
            <div class="example">
              <div class="example-question">
                ${example.question}
              </div>

              <div class="example-solution">
                <strong>Solution:</strong>
                ${example.solution}
              </div>
            </div>
          `)
          .join("")}
      `;
    }

    function createConversionTable(conversionTable) {
      if (
        !Array.isArray(conversionTable) ||
        conversionTable.length === 0
      ) {
        return "";
      }

      return `
        <h3>Common Fraction Conversions</h3>

        <table class="conversion-table">
          <thead>
            <tr>
              <th>Fraction</th>
              <th>Percentage</th>
            </tr>
          </thead>

          <tbody>
            ${conversionTable
              .map(item => `
                <tr>
                  <td>${item.fraction}</td>
                  <td>${item.percentage}</td>
                </tr>
              `)
              .join("")}
          </tbody>
        </table>
      `;
    }

    function createSections(sections) {
      if (!Array.isArray(sections)) {
        return "";
      }

      return sections
        .map(section => `
          <section class="content-card">
            <h2>${section.heading}</h2>

            ${createList(section.content)}

            ${createFormulas(section.formulas)}

            ${createConversionTable(section.conversionTable)}

            ${createExamples(section.examples)}
          </section>
        `)
        .join("");
    }

    function createShortcuts(shortcuts) {
      if (!Array.isArray(shortcuts) || shortcuts.length === 0) {
        return "";
      }

      return `
        <section class="content-card">
          <h2>Quick Placement Shortcuts</h2>

          <div class="shortcut-grid">
            ${shortcuts
              .map(shortcut => `
                <div class="shortcut">
                  <strong>${shortcut.title}</strong>
                  <span>${shortcut.note}</span>
                </div>
              `)
              .join("")}
          </div>
        </section>
      `;
    }

    function createAssessmentLink(assessment) {
      /*
        assessment.html receives the exact question JSON path.

        It does not open the JSON as a plain text page.
        The assessment page will load that JSON and display
        questions to the student.
      */
      const assessmentUrl =
        `${assessment.page}` +
        `?category=${encodeURIComponent(assessment.category)}` +
        `&topic=${encodeURIComponent(assessment.topic)}` +
        `&file=${encodeURIComponent(assessment.questionFile)}`;

      return assessmentUrl;
    }

    function renderTopic(data) {
      document.title =
        `${data.title} | Assessment Portal`;

      const assessmentUrl =
        createAssessmentLink(data.assessment);

      pageContent.innerHTML = `
        <section class="topic-hero">
          <span class="category-label">
            ${data.category}
          </span>

          <h1>${data.title}</h1>

          <div class="topic-subtitle">
            ${data.subtitle}
          </div>

          <p class="topic-description">
            ${data.description}
          </p>

          <span class="learning-time">
            Estimated learning time:
            ${data.estimatedLearningTime}
          </span>
        </section>

        <section class="content-card">
          <h2>Learning Objectives</h2>
          ${createList(data.learningObjectives)}
        </section>

        ${createSections(data.sections)}

        ${createShortcuts(data.quickShortcuts)}

        <section class="content-card">
          <h2>Common Placement Question Types</h2>
          ${createList(data.placementQuestionTypes)}
        </section>

        <section class="content-card mistake-card">
          <h2>Common Mistakes to Avoid</h2>
          ${createList(data.commonMistakes)}
        </section>

        <section class="content-card">
          <h2>Revision Checklist</h2>
          ${createList(data.revisionChecklist)}
        </section>

        <section class="assessment-area">
          <h2>Learning Completed</h2>

          <p>
            Review the formulas once and begin the
            Percentages assessment.
          </p>

          <a
            class="start-button"
            href="${assessmentUrl}"
          >
            ${data.assessment.buttonText}
          </a>
        </section>
      `;
    }

    async function loadTopic() {
      try {
        const response = await fetch(topicFile);

        if (!response.ok) {
          throw new Error(
            `Unable to load ${topicFile}`
          );
        }

        const topicData = await response.json();

        renderTopic(topicData);
      } catch (error) {
        console.error(error);

        pageContent.innerHTML = `
          <div class="error-message">
            <h2>Learning content could not be loaded</h2>

            <p>
              Check that this file exists:
              <strong>${topicFile}</strong>
            </p>
          </div>
        `;
      }
    }

    loadTopic();
  </script>
</body>
</html>
