<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Assessment Result</title>

  <style>
    :root {
      --primary: #3157d5;
      --primary-dark: #223e9f;
      --background: #f4f7fc;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #64748b;
      --border: #dfe5ef;
      --success: #15803d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--background);
      color: var(--text);
    }

    a {
      text-decoration: none;
    }

    .header {
      padding: 20px;
      text-align: center;
      color: white;
      background: linear-gradient(
        135deg,
        var(--primary-dark),
        var(--primary)
      );
    }

    .container {
      width: min(720px, 92%);
      margin: 40px auto;
    }

    .result-card {
      padding: 32px;
      text-align: center;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 8px 24px rgba(31, 41, 55, 0.08);
    }

    .score-circle {
      width: 150px;
      height: 150px;
      margin: 24px auto;
      display: grid;
      place-items: center;
      border: 12px solid #dfe7ff;
      border-radius: 50%;
      color: var(--primary);
    }

    .score-circle strong {
      display: block;
      font-size: 34px;
    }

    .score-circle span {
      font-size: 14px;
      color: var(--muted);
    }

    .details {
      margin-top: 25px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      text-align: left;
    }

    .detail {
      padding: 14px;
      border-radius: 10px;
      background: #f8fafc;
    }

    .detail span {
      display: block;
      margin-bottom: 4px;
      color: var(--muted);
      font-size: 13px;
    }

    .detail strong {
      font-size: 17px;
    }

    .saved-message {
      margin-top: 22px;
      color: var(--success);
      font-weight: 700;
    }

    .button {
      display: inline-block;
      margin-top: 24px;
      padding: 12px 22px;
      border-radius: 9px;
      color: white;
      background: var(--primary);
      font-weight: 700;
    }

    @media (max-width: 550px) {
      .details {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <header class="header">
    <h1>Assessment Result</h1>
  </header>

  <main class="container">
    <section class="result-card" id="resultCard">
      Loading result...
    </section>
  </main>

  <script>
    const resultCard =
      document.getElementById("resultCard");

    const savedResult =
      sessionStorage.getItem(
        "latestAssessmentResult"
      );

    if (!savedResult) {
      resultCard.innerHTML = `
        <h2>No result found</h2>

        <p style="margin-top: 12px;">
          Complete an assessment to view the result.
        </p>

        <a class="button" href="index.html">
          Go to Topics
        </a>
      `;
    } else {
      const result = JSON.parse(savedResult);

      const minutes =
        Math.floor(result.time_taken_seconds / 60);

      const seconds =
        result.time_taken_seconds % 60;

      const formattedTime =
        `${String(minutes).padStart(2, "0")}:` +
        `${String(seconds).padStart(2, "0")}`;

      resultCard.innerHTML = `
        <h2>${result.title}</h2>

        <p style="margin-top: 8px; color: #64748b;">
          ${result.student_name}
          ·
          ${result.roll_number}
        </p>

        <div class="score-circle">
          <div>
            <strong>${result.percentage}%</strong>
            <span>
              ${result.score}/${result.total_questions}
            </span>
          </div>
        </div>

        <div class="details">
          <div class="detail">
            <span>Correct answers</span>
            <strong>${result.correct_answers}</strong>
          </div>

          <div class="detail">
            <span>Incorrect answers</span>
            <strong>${result.incorrect_answers}</strong>
          </div>

          <div class="detail">
            <span>Unanswered</span>
            <strong>${result.unanswered}</strong>
          </div>

          <div class="detail">
            <span>Time taken</span>
            <strong>${formattedTime}</strong>
          </div>
        </div>

        <p class="saved-message">
          Your result was saved successfully.
        </p>

        <a class="button" href="index.html">
          Return to Topics
        </a>
      `;
    }
  </script>
</body>
</html>
